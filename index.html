<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pendência</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/pt.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #1a1a1a);
      --muted: var(--tg-theme-hint-color, #707579);
      --button-bg: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --section-bg: var(--tg-theme-section-bg-color, #f5f5f5);
      --separator: var(--tg-theme-section-separator-color, #e0e0e0);
      --accent: var(--tg-theme-accent-text-color, #2481cc);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.4;
    }
    h1 { font-size: 19px; margin: 4px 0 12px 0; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin: 14px 0 6px 0; }
    section {
      background: var(--section-bg);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 8px;
    }
    label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 14px; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 2px; }
    input[type="text"], input[type="number"], input[type="datetime-local"], input[type="time"],
    select, textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--separator);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
    }
    textarea { resize: vertical; min-height: 50px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .chip {
      padding: 5px 11px;
      border: 1px solid var(--separator);
      border-radius: 999px;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
    }
    .chip.selected {
      background: var(--accent);
      color: var(--button-text);
      border-color: var(--accent);
    }
    .chip.day { min-width: 36px; text-align: center; padding: 6px 9px; }
    .chip-input {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--separator);
      border-radius: 999px;
      padding: 2px 8px 2px 10px;
      background: var(--bg);
    }
    .chip-input input {
      border: none; outline: none; background: transparent;
      width: 60px; padding: 4px 0; font-size: 13px; color: var(--text);
    }
    .chip-input button {
      border: none; background: var(--accent); color: var(--button-text);
      border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 0;
    }
    .toggle-row label { margin: 0; flex: 1; }
    input[type="checkbox"] { width: 20px; height: 20px; flex-shrink: 0; }
    .hidden { display: none !important; }
    .field { margin-bottom: 10px; }
    .field:last-child { margin-bottom: 0; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }

    .item-card {
      background: var(--bg);
      border: 1px solid var(--separator);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .item-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .item-num { font-size: 13px; color: var(--muted); font-weight: 600; }
    .item-remove {
      margin-left: auto; color: #d33; cursor: pointer;
      font-size: 18px; user-select: none; padding: 0 4px;
    }
    .expand-toggle {
      background: transparent; border: none; color: var(--accent);
      font-size: 13px; cursor: pointer; padding: 4px 0;
    }
    .item-details { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--separator); }

    .add-item-btn {
      width: 100%; padding: 10px; border: 1px dashed var(--separator);
      border-radius: 10px; background: transparent; color: var(--accent);
      font-size: 14px; cursor: pointer; margin-top: 4px;
    }
    .actions {
      display: flex; gap: 8px; margin-top: 16px;
      position: sticky; bottom: 0; background: var(--bg); padding-top: 8px;
    }
    button.primary {
      flex: 1; padding: 12px; border: none; border-radius: 10px;
      background: var(--button-bg); color: var(--button-text);
      font-size: 16px; font-weight: 600; cursor: pointer;
    }
    button.secondary {
      padding: 12px 18px; border: 1px solid var(--separator);
      border-radius: 10px; background: var(--bg); color: var(--text);
      font-size: 16px; cursor: pointer;
    }
  </style>
</head>
<body>
  <h1 id="heading">Nova pendência</h1>

  <form id="form" novalidate>
    <section id="section-recipient" class="hidden">
      <div class="field">
        <label for="recipient">Para quem</label>
        <select id="recipient">
          <option value="">Para mim</option>
        </select>
      </div>
    </section>

    <div id="shared-block">
      <h2>Padrões — usados ao adicionar itens novos</h2>
      <section id="shared-section"></section>
    </div>

    <h2 id="items-heading">Itens</h2>
    <section id="items-section">
      <div id="items-list"></div>
      <button type="button" id="add-item-btn" class="add-item-btn">+ Adicionar item</button>
    </section>

    <div class="actions">
      <button type="button" class="secondary" id="cancel-btn">Cancelar</button>
      <button type="button" class="secondary" id="copy-btn">📋 Copiar</button>
      <button type="submit" class="primary" id="submit-btn">Criar</button>
    </div>
    <div id="copy-output-wrap" class="hidden">
      <p class="muted">Copie o texto abaixo e cole no chat (caso o botão acima não funcione):</p>
      <textarea id="copy-output" readonly rows="4"></textarea>
    </div>
  </form>

  <template id="field-template">
    <div class="field" data-field="deadline">
      <label>Prazo</label>
      <input type="text" data-bind="deadline_at" data-flatpickr placeholder="Selecione data e hora" />
    </div>
    <div class="field" data-field="start_at">
      <label>Começar a alertar em</label>
      <input type="text" data-bind="start_alerting_at" data-flatpickr placeholder="Selecione data e hora" />
    </div>
    <div class="field" data-field="frequency">
      <label>Frequência (intervalo de repetição)</label>
      <div class="chips" data-chips="frequency">
        <div class="chip" data-value="">Única</div>
        <div class="chip" data-value="15">15min</div>
        <div class="chip" data-value="30">30min</div>
        <div class="chip" data-value="60">1h</div>
        <div class="chip" data-value="240">4h</div>
        <div class="chip" data-value="1440">Diária</div>
        <span class="chip-input">
          <input type="number" min="15" placeholder="min" data-custom="frequency" />
          <button type="button" data-add-custom="frequency">+</button>
        </span>
      </div>
    </div>
    <div class="field" data-field="pre_alerts">
      <label>Alertas antes do prazo</label>
      <div class="chips" data-chips="pre_alerts">
        <div class="chip" data-value="10">10min</div>
        <div class="chip" data-value="30">30min</div>
        <div class="chip" data-value="60">1h</div>
        <div class="chip" data-value="1440">1 dia</div>
        <span class="chip-input">
          <input type="number" min="1" placeholder="min" data-custom="pre_alerts" />
          <button type="button" data-add-custom="pre_alerts">+</button>
        </span>
      </div>
    </div>
    <div class="field" data-field="methods">
      <label>Métodos</label>
      <div class="chips" data-chips="methods">
        <div class="chip" data-value="message">Mensagem</div>
        <div class="chip" data-value="ring">Chamada</div>
      </div>
    </div>
    <div class="field" data-field="days">
      <label>Dias da semana</label>
      <div class="chips" data-chips="allowed_days">
        <div class="chip day" data-value="0">Seg</div>
        <div class="chip day" data-value="1">Ter</div>
        <div class="chip day" data-value="2">Qua</div>
        <div class="chip day" data-value="3">Qui</div>
        <div class="chip day" data-value="4">Sex</div>
        <div class="chip day" data-value="5">Sáb</div>
        <div class="chip day" data-value="6">Dom</div>
      </div>
    </div>
    <div class="field" data-field="time_window">
      <label>Janela de horário</label>
      <div class="row">
        <input type="time" data-bind="allowed_time_start" />
        <input type="time" data-bind="allowed_time_end" />
      </div>
      <div class="hint">Vazio (ou mesmo horário nos dois) = dia inteiro.</div>
    </div>
    <div class="toggle-row" data-field="ignore_quiet">
      <label>Ignorar silêncio noturno</label>
      <input type="checkbox" data-bind="ignore_quiet_hours" />
    </div>
    <div class="toggle-row" data-field="importante">
      <label>Importante (requer comprovante)</label>
      <input type="checkbox" data-bind="importante" />
    </div>
    <div class="field hidden" data-field="description">
      <label>Descrição</label>
      <textarea data-bind="description"></textarea>
    </div>
  </template>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    function parseFragment() {
      const hash = window.location.hash.replace(/^#/, "");
      if (!hash) return {};
      try {
        const params = new URLSearchParams(hash);
        const data = params.get("data");
        if (!data) return {};
        // Backend encodes UTF-8 → base64url. atob returns a Latin-1 binary string,
        // so we have to widen back to bytes and re-decode as UTF-8 to recover
        // accents and ç correctly.
        const binary = atob(data.replace(/-/g, "+").replace(/_/g, "/"));
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return JSON.parse(new TextDecoder("utf-8").decode(bytes));
      } catch (e) { console.error(e); return {}; }
    }
    const state = parseFragment();
    const isEdit = state.mode === "edit";

    if (isEdit) {
      document.getElementById("heading").textContent = "Editar pendência";
      document.getElementById("submit-btn").textContent = "Salvar";
      document.getElementById("items-heading").textContent = "Item";
      document.getElementById("add-item-btn").classList.add("hidden");
      document.getElementById("shared-block").classList.add("hidden");
    }

    const recipientSelect = document.getElementById("recipient");
    (state.contacts || []).forEach((c) => {
      const opt = document.createElement("option");
      opt.value = c.phone;
      opt.textContent = `@${c.nickname} — ${c.display || c.phone}`;
      recipientSelect.appendChild(opt);
    });
    if ((state.contacts || []).length > 0 || state.preselect_recipient_phone) {
      document.getElementById("section-recipient").classList.remove("hidden");
    }
    if (state.preselect_recipient_phone) recipientSelect.value = state.preselect_recipient_phone;
    if (isEdit) {
      // Recipient can't change on edit — the backend ignores it. Disable the
      // select so the user doesn't expect a behavior that won't happen.
      recipientSelect.disabled = true;
    }

    // ---- Field bundle: cloned into shared section + each item card ----
    function buildFieldBundle(container, initial, opts = {}) {
      const tpl = document.getElementById("field-template");
      container.appendChild(tpl.content.cloneNode(true));

      if (opts.showDescription) {
        container.querySelector('[data-field="description"]').classList.remove("hidden");
      }

      // Initialize flatpickr on opted-in inputs first so we can call setDate.
      container.querySelectorAll("[data-flatpickr]").forEach((el) => {
        const fp = flatpickr(el, {
          enableTime: true,
          time_24hr: true,
          minuteIncrement: 5,
          dateFormat: "Y-m-d H:i",
          locale: typeof flatpickr !== "undefined" && flatpickr.l10ns?.pt ? "pt" : undefined,
          allowInput: true,
        });
        el._fp = fp;
      });

      // Direct-bound inputs
      container.querySelectorAll("[data-bind]").forEach((el) => {
        const key = el.dataset.bind;
        const val = initial[key];
        if (val == null) return;
        if (el.type === "checkbox") el.checked = !!val;
        else if (el._fp) el._fp.setDate(new Date(val), true);
        else el.value = val;
      });

      const freqVal = initial.frequency_minutes;
      initSingleChips(container.querySelector('[data-chips="frequency"]'),
                      freqVal == null ? "" : String(freqVal));
      initMultiChips(container.querySelector('[data-chips="methods"]'),
                     (initial.methods || ["message"]));
      initMultiChips(container.querySelector('[data-chips="pre_alerts"]'),
                     (initial.pre_alerts || []).map(String));
      const days = (initial.allowed_days || [0, 1, 2, 3, 4, 5, 6]).map(String);
      initMultiChips(container.querySelector('[data-chips="allowed_days"]'), days);

      // Importante toggle visible only when posting for someone else
      const impRow = container.querySelector('[data-field="importante"]');
      function refreshImp() {
        if (recipientSelect.value) impRow.classList.remove("hidden");
        else { impRow.classList.add("hidden"); impRow.querySelector("input").checked = false; }
      }
      refreshImp();
      recipientSelect.addEventListener("change", refreshImp);

      // Custom-value buttons
      container.querySelectorAll("[data-add-custom]").forEach((btn) => {
        const key = btn.dataset.addCustom;
        btn.addEventListener("click", () => {
          const inputEl = container.querySelector(`[data-custom="${key}"]`);
          const raw = inputEl.value.trim();
          if (!raw) return;
          const n = parseInt(raw, 10);
          if (!isFinite(n) || n <= 0) return;
          const chipsContainer = container.querySelector(`[data-chips="${key}"]`);
          let chip = chipsContainer.querySelector(`.chip[data-value="${n}"]`);
          if (!chip) {
            chip = document.createElement("div");
            chip.className = "chip";
            chip.dataset.value = String(n);
            chip.textContent = `${n}min`;
            chip.addEventListener("click", () => {
              if (key === "frequency") {
                chipsContainer.querySelectorAll(".chip").forEach((c) => c.classList.remove("selected"));
                chip.classList.add("selected");
              } else {
                chip.classList.toggle("selected");
              }
            });
            chipsContainer.insertBefore(chip, chipsContainer.querySelector(".chip-input"));
          }
          if (key === "frequency") {
            chipsContainer.querySelectorAll(".chip").forEach((c) => c.classList.remove("selected"));
            chip.classList.add("selected");
          } else {
            chip.classList.add("selected");
          }
          inputEl.value = "";
        });
      });
    }

    function _wireSingleChip(chip, container) {
      chip.addEventListener("click", () => {
        container.querySelectorAll(".chip").forEach((c) => c.classList.remove("selected"));
        chip.classList.add("selected");
      });
    }
    function _wireMultiChip(chip) {
      chip.addEventListener("click", () => chip.classList.toggle("selected"));
    }
    function _ensureChip(container, value, label) {
      let chip = container.querySelector(`.chip[data-value="${CSS.escape(value)}"]`);
      if (chip) return chip;
      chip = document.createElement("div");
      chip.className = "chip";
      chip.dataset.value = value;
      chip.textContent = label;
      const inputEl = container.querySelector(".chip-input");
      if (inputEl) container.insertBefore(chip, inputEl);
      else container.appendChild(chip);
      return chip;
    }
    function _supportsCustom(container) {
      return !!container.querySelector(".chip-input");
    }
    function initSingleChips(container, initial) {
      container.querySelectorAll(".chip").forEach((chip) => _wireSingleChip(chip, container));
      if (initial === "" || initial == null) {
        const empty = container.querySelector('.chip[data-value=""]');
        if (empty) empty.classList.add("selected");
        return;
      }
      let chip = container.querySelector(`.chip[data-value="${CSS.escape(String(initial))}"]`);
      if (!chip && _supportsCustom(container)) {
        chip = _ensureChip(container, String(initial), `${initial}min`);
        _wireSingleChip(chip, container);
      }
      if (chip) chip.classList.add("selected");
    }
    function initMultiChips(container, initialValues) {
      container.querySelectorAll(".chip").forEach((chip) => _wireMultiChip(chip));
      const custom = _supportsCustom(container);
      initialValues.forEach((v) => {
        let chip = container.querySelector(`.chip[data-value="${CSS.escape(String(v))}"]`);
        if (!chip && custom) {
          chip = _ensureChip(container, String(v), `${v}min`);
          _wireMultiChip(chip);
        }
        if (chip) chip.classList.add("selected");
      });
    }

    function readBundle(container) {
      const data = {};
      container.querySelectorAll("[data-bind]").forEach((el) => {
        const key = el.dataset.bind;
        if (el.type === "checkbox") data[key] = el.checked;
        else if (el._fp) {
          const sel = el._fp.selectedDates[0];
          data[key] = sel ? sel.toISOString() : null;
        } else if (el.type === "time") {
          data[key] = el.value || "00:00";
        } else {
          data[key] = el.value.trim();
        }
      });
      const freqSel = Array.from(container.querySelectorAll('[data-chips="frequency"] .chip.selected'));
      data.frequency_minutes = freqSel.length && freqSel[0].dataset.value
        ? parseInt(freqSel[0].dataset.value, 10) : null;
      data.methods = Array.from(container.querySelectorAll('[data-chips="methods"] .chip.selected'))
        .map((c) => c.dataset.value);
      data.pre_alerts = Array.from(container.querySelectorAll('[data-chips="pre_alerts"] .chip.selected'))
        .map((c) => parseInt(c.dataset.value, 10));
      data.allowed_days = Array.from(container.querySelectorAll('[data-chips="allowed_days"] .chip.selected'))
        .map((c) => parseInt(c.dataset.value, 10));
      return data;
    }

    // ---- Shared defaults section ----
    const sharedSection = document.getElementById("shared-section");
    if (!isEdit) {
      const ud = state.user_defaults || {};
      buildFieldBundle(sharedSection, {
        frequency_minutes: "frequency_minutes" in ud ? ud.frequency_minutes : null,
        methods: ud.methods || ["message"],
        pre_alerts: ud.pre_alerts || [],
        allowed_days: ud.allowed_days || [0, 1, 2, 3, 4, 5, 6],
        allowed_time_start: ud.allowed_time_start || "00:00",
        allowed_time_end: ud.allowed_time_end || "00:00",
        ignore_quiet_hours: !!ud.ignore_quiet_hours,
      });
    }
    function snapshotShared() {
      return isEdit ? {} : readBundle(sharedSection);
    }

    // ---- Items ----
    const itemsList = document.getElementById("items-list");
    let itemCounter = 0;

    function makeItemCard(initial = null) {
      itemCounter += 1;
      const idx = itemCounter;
      const card = document.createElement("div");
      card.className = "item-card";
      // While true, this card just inherits shared defaults at submit time.
      // Flipped to false the first time the user opens Personalizar, so any
      // customization sticks even if shared changes afterwards.
      card._followsShared = !isEdit;

      const header = document.createElement("div");
      header.className = "item-card-header";
      header.innerHTML = `<span class="item-num" data-num>#${idx}</span>
        ${isEdit ? "" : '<button type="button" class="expand-toggle">Personalizar ▾</button>'}
        ${isEdit ? "" : '<span class="item-remove" data-remove>✕</span>'}`;
      card.appendChild(header);

      const titleWrap = document.createElement("div");
      titleWrap.className = "field";
      titleWrap.innerHTML = `<label>Título *</label><input type="text" data-item-title placeholder="Ex: Pagar luz" />`;
      card.appendChild(titleWrap);

      const details = document.createElement("div");
      details.className = "item-details";
      if (!isEdit) details.classList.add("hidden");
      card.appendChild(details);

      const init = initial || (isEdit ? state : snapshotShared());
      buildFieldBundle(details, init, { showDescription: isEdit });
      card._buildInit = init;

      titleWrap.querySelector("[data-item-title]").value =
        (initial && initial.title) || (isEdit && state.title) || "";

      if (!isEdit) {
        header.querySelector(".expand-toggle").addEventListener("click", () => {
          // Re-snapshot shared the first time, so the user sees current
          // shared values (not stale ones from when the card was created).
          if (card._followsShared) {
            card._followsShared = false;
            const fresh = snapshotShared();
            details.innerHTML = "";
            buildFieldBundle(details, fresh, { showDescription: false });
          }
          details.classList.toggle("hidden");
        });
        header.querySelector("[data-remove]").addEventListener("click", () => {
          if (itemsList.children.length > 1) {
            card.remove();
            renumber();
          }
        });
      }
      itemsList.appendChild(card);
      return card;
    }
    function renumber() {
      itemsList.querySelectorAll("[data-num]").forEach((el, i) => {
        el.textContent = `#${i + 1}`;
      });
    }

    if (isEdit) {
      makeItemCard(state);
    } else {
      makeItemCard();
    }
    document.getElementById("add-item-btn").addEventListener("click", () => {
      makeItemCard();
      renumber();
    });

    // ---- Submit ----
    function buildPayload() {
      const cards = Array.from(itemsList.children);
      const items = [];
      for (const card of cards) {
        const title = card.querySelector("[data-item-title]").value.trim();
        if (!title) continue;
        // Untouched cards (Personalizar never opened) inherit every shared
        // default. Emit only the title so the backend's `pick()` falls back.
        if (card._followsShared) {
          items.push({ title });
          continue;
        }
        const data = readBundle(card.querySelector(".item-details"));
        data.title = title;
        items.push(data);
      }
      if (items.length === 0) {
        alert("Adicione pelo menos um item com título.");
        return null;
      }
      const shared = isEdit ? {} : readBundle(sharedSection);
      shared.recipient_phone = recipientSelect.value || null;
      if (isEdit) {
        return {
          mode: "edit",
          item_id: state.item_id ?? null,
          recipient_phone: shared.recipient_phone,
          ...items[0],
        };
      }
      return { mode: "create_batch", shared, items };
    }

    // Strip fields that would resolve to the same value via shared/platform default,
    // so the payload fits Telegram's 4096-byte sendData limit.
    const PLATFORM_DEFAULTS = {
      description: "", deadline_at: null, start_alerting_at: null,
      frequency_minutes: null, methods: ["message"], pre_alerts: [],
      allowed_days: [0, 1, 2, 3, 4, 5, 6],
      allowed_time_start: "00:00", allowed_time_end: "00:00",
      ignore_quiet_hours: false, importante: false,
    };
    function deepEq(a, b) {
      if (a === b) return true;
      if (Array.isArray(a) && Array.isArray(b)) {
        if (a.length !== b.length) return false;
        return a.every((v, i) => deepEq(v, b[i]));
      }
      return false;
    }
    function effective(key, shared) {
      return (key in shared && shared[key] != null) ? shared[key] : PLATFORM_DEFAULTS[key];
    }
    function compactShared(shared) {
      const out = {};
      for (const [k, v] of Object.entries(shared)) {
        if (k === "recipient_phone") { if (v) out[k] = v; continue; }
        if (k in PLATFORM_DEFAULTS && deepEq(v, PLATFORM_DEFAULTS[k])) continue;
        out[k] = v;
      }
      return out;
    }
    function compactItem(item, shared) {
      const out = { title: item.title };
      for (const [k, v] of Object.entries(item)) {
        if (k === "title") continue;
        if (k in PLATFORM_DEFAULTS && deepEq(v, effective(k, shared))) continue;
        out[k] = v;
      }
      return out;
    }
    function compactPayload(payload) {
      if (payload.mode !== "create_batch") return payload;
      const shared = payload.shared || {};
      return {
        mode: "create_batch",
        shared: compactShared(shared),
        items: (payload.items || []).map((it) => compactItem(it, shared)),
      };
    }

    function doSubmit() {
      const payload = buildPayload();
      if (!payload) return;
      const out = compactPayload(payload);
      if (tg) {
        tg.sendData(JSON.stringify(out));
        tg.close();
      } else {
        alert("Preview:\n" + JSON.stringify(out, null, 2));
      }
    }

    // -------- Copy as /adicionar batch command --------
    function shEscape(s) {
      if (s == null) return "";
      const str = String(s);
      if (str === "") return "''";
      if (!/[\s"'\\$`]/.test(str)) return str;
      return "'" + str.replace(/'/g, "'\\''") + "'";
    }
    function methodCli(m) { return m === "ring" ? "chamada" : "mensagem"; }
    function flagsFor(obj, sharedRef) {
      // sharedRef === null means we're emitting shared itself; treat as platform defaults
      const parts = [];
      const shared = sharedRef || {};
      function emit(key, build) {
        if (!(key in obj)) return;
        const v = obj[key];
        const eff = sharedRef ? effective(key, shared) : PLATFORM_DEFAULTS[key];
        if (deepEq(v, eff)) return;
        const tokens = build(v);
        if (tokens) parts.push(...tokens);
      }
      emit("deadline_at",       (v) => v ? ["-p", shEscape(v)] : null);
      emit("start_alerting_at", (v) => v ? ["-S", shEscape(v)] : null);
      emit("frequency_minutes", (v) => v == null ? ["-f", "unica"] : ["-f", String(v)]);
      emit("methods",           (v) => Array.isArray(v) && v.length ? ["-m", v.map(methodCli).join(",")] : null);
      emit("importante",        (v) => v ? ["-i"] : null);
      emit("ignore_quiet_hours",(v) => v ? ["-q"] : null);
      return parts;
    }
    function buildAdicionarText(payload) {
      if (payload.mode !== "create_batch") return null;
      const shared = payload.shared || {};
      const sharedFlags = ["/adicionar"];
      if (shared.recipient_phone) sharedFlags.push("-d", shEscape(shared.recipient_phone));
      sharedFlags.push(...flagsFor(shared, null));
      const lines = [sharedFlags.join(" ")];
      for (const item of (payload.items || [])) {
        const parts = ["-t", shEscape(item.title || "")];
        parts.push(...flagsFor(item, shared));
        lines.push(parts.join(" "));
      }
      return lines.join("\n");
    }

    function doCopy() {
      const payload = buildPayload();
      if (!payload) return;
      const cmd = buildAdicionarText(payload) || JSON.stringify(payload);
      const out = document.getElementById("copy-output");
      out.value = cmd;
      document.getElementById("copy-output-wrap").classList.remove("hidden");
      let copied = false;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(cmd).then(() => { copied = true; }, () => {});
      }
      out.focus();
      out.select();
      try { document.execCommand("copy"); copied = true; } catch (e) {}
      if (copied && tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    }

    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      doSubmit();
    });
    document.getElementById("submit-btn").addEventListener("click", (e) => {
      e.preventDefault();
      doSubmit();
    });

    document.getElementById("cancel-btn").addEventListener("click", () => {
      if (tg) tg.close();
    });
    document.getElementById("copy-btn").addEventListener("click", doCopy);

    function isoToLocalInput(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      const pad = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    function localInputToIso(s) {
      if (!s) return null;
      const d = new Date(s);
      return d.toISOString();
    }
  </script>
</body>
</html>
